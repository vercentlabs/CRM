packages:
  - apps/*
  - packages/*
allowBuilds:
  bcrypt: true
  esbuild: true
  msgpackr-extract: false
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.5'
  - '@turbo/darwin-arm64@2.11.5'
  - '@turbo/linux-64@2.11.5'
  - '@turbo/linux-arm64@2.11.5'
  - '@turbo/windows-64@2.11.5'
  - '@turbo/windows-arm64@2.11.5'
  - turbo@2.11.5
# Phase 1 lock preservation: keep the exact versions the pre-monorepo npm/pnpm
# lockfiles resolved, so the package-manager switch does not silently upgrade
# anything. Remove an entry only as a deliberate, tested upgrade.
overrides:
  # Phase 7 security upgrade (deliberate, tested): axios advisories fixed in >= 1.16.
  axios: 1.20.0
  dotenv: 17.2.3
  eslint: 9.39.2
  '@expo/vector-icons': 15.0.3
  eslint-plugin-react-hooks: 7.0.1
  # Phase 7 security overrides for vulnerable transitive dependencies
  # (pnpm audit --prod). plivo -> request (deprecated) pulls old form-data,
  # qs and tough-cookie; Expo build tooling pulls old postcss. Each override
  # stays within an API-compatible line.
  'form-data@<2.5.6': 2.5.6
  'qs@<6.16.0': ^6.16.0
  'tough-cookie@<4.1.3': ^4.1.4
  'postcss@<8.5.23': ^8.5.28

# Accepted residual audit findings (reasons: docs/operations/SECURITY.md#dependency-audit-phase-7).
# Re-evaluate on every dependency update; never add an entry without a documented reason.
auditConfig:
  ignoreGhsas:
    - GHSA-p8p7-x288-28g6 # request SSRF (plivo SDK; no patched release)
    - GHSA-w5hq-g745-h8pq # uuid v3/v5/v6 buffer (request uses v4 only)
    - GHSA-5p2g-fcmc-qvqq # image-size DoS (Expo build tooling, own assets only)
    - GHSA-w3rx-r6r6-pgpr # image-size DoS (Expo build tooling, own assets only)
